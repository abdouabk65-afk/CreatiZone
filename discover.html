<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChallengeHub — Découvrir</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Palette fournie */
      --c1:  #e7f5dc;  /* très clair */
      --c2:  #cfe1b9;
      --c3:  #b6c99b;
      --c4:  #98a77c;
      --c5:  #88976c;
      --c6:  #728156;
      --c7:  #0f2a1d;  /* très foncé */
      --c8:  #375534;
      --c9:  #6b9071;
      --c10: #aec3b0;
      --c11: #e3eed4;

      /* Mapping sémantique */
      --bg-main:     var(--c11);
      --bg-card:     #ffffff;
      --bg-sidebar:  var(--c1);
      --bg-input:    #f4f9ee;
      --border-soft: rgba(114,129,86,0.15);
      --border-med:  rgba(114,129,86,0.30);
      --text-dark:   var(--c7);
      --text-mid:    var(--c8);
      --text-muted:  var(--c9);
      --text-light:  var(--c10);
      --accent:      var(--c6);
      --accent-dark: var(--c7);
      --accent-mid:  var(--c5);
      --accent-soft: var(--c4);
      --accent-pale: var(--c2);
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 10% 0%, rgba(114,129,86,.08) 0%, transparent 60%),
        radial-gradient(ellipse at 90% 100%, rgba(107,144,113,.06) 0%, transparent 60%);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--c11); }
    ::-webkit-scrollbar-thumb { background: var(--c4); border-radius: 10px; }

    /* ── Typography ── */
    .serif { font-family: 'DM Serif Display', Georgia, serif; }

    /* ── Boxes ── */
    .box {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 20px;
      box-shadow: 0 2px 20px rgba(15,42,29,.05);
    }

    /* ── Forms ── */
    .form-control,
    .form-select {
      background-color: var(--bg-input) !important;
      border: 1.5px solid var(--border-med) !important;
      color: var(--text-dark) !important;
      border-radius: 12px !important;
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-control:focus,
    .form-select:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(114,129,86,.12) !important;
    }
    .form-control::placeholder { color: var(--text-light) !important; }
    .form-select option { background: white; color: var(--text-dark); }

    .input-group-text {
      background-color: var(--bg-input) !important;
      border: 1.5px solid var(--border-med) !important;
      border-right: none !important;
      color: var(--text-muted) !important;
      border-radius: 12px 0 0 12px !important;
    }
    .input-group .form-control {
      border-left: none !important;
      border-radius: 0 12px 12px 0 !important;
    }

    /* ── Btn Créer ── */
    .btn-create {
      background: var(--c7);
      border: none;
      color: var(--c2);
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: .875rem;
      border-radius: 12px;
      padding: .5rem 1.2rem;
      letter-spacing: .01em;
      transition: background .2s, transform .15s, box-shadow .2s;
      white-space: nowrap;
    }
    .btn-create:hover {
      background: var(--c8);
      color: var(--c1);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(15,42,29,.20);
    }
    .btn-create:active { transform: translateY(0); }

    /* ── Btn Reset ── */
    .btn-reset {
      background: transparent;
      border: 1.5px solid var(--border-med);
      color: var(--text-muted);
      border-radius: 12px;
      padding: .5rem .9rem;
      font-size: .875rem;
      transition: all .2s;
    }
    .btn-reset:hover {
      background: var(--bg-input);
      border-color: var(--accent);
      color: var(--text-dark);
    }

    /* ── Catégories ── */
    .cat-btn {
      width: 100%;
      text-align: left;
      border-radius: 12px !important;
      border: 1.5px solid transparent !important;
      color: var(--text-muted) !important;
      background: transparent !important;
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      transition: all .2s;
      padding: .5rem .75rem;
    }
    .cat-btn:hover {
      background: var(--bg-input) !important;
      color: var(--text-dark) !important;
      border-color: var(--border-soft) !important;
    }
    .cat-btn.active-cat {
      background: var(--c7) !important;
      border-color: var(--c7) !important;
      color: var(--c2) !important;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(15,42,29,.18);
    }
    .cat-btn.active-cat .badge-total {
      background: rgba(207,225,185,.20);
      color: var(--c2);
    }

    /* ── Profil sidebar ── */
    .profile-card {
      background: linear-gradient(160deg, var(--c7) 0%, var(--c8) 100%);
      border: none;
      border-radius: 20px;
      padding: 1.75rem 1.25rem 1.25rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(15,42,29,.18);
    }
    .profile-card::before {
      content: "";
      position: absolute;
      top: -40px;
      right: -40px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(174,195,176,.08);
    }
    .profile-card::after {
      content: "";
      position: absolute;
      bottom: -30px;
      left: -30px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(174,195,176,.06);
    }
    .profile-avatar-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: .85rem;
    }
    .profile-avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(207,225,185,.35);
      box-shadow: 0 0 0 6px rgba(207,225,185,.10);
    }
    .profile-online {
      position: absolute;
      bottom: 3px;
      right: 3px;
      width: 13px;
      height: 13px;
      background: #7adb70;
      border: 2px solid var(--c7);
      border-radius: 50%;
    }
    .profile-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.15rem;
      color: var(--c1);
      margin-bottom: .15rem;
      position: relative;
    }
    .profile-role {
      font-size: .75rem;
      color: var(--c10);
      margin-bottom: .9rem;
      letter-spacing: .02em;
      position: relative;
    }
    .profile-divider {
      border: none;
      border-top: 1px solid rgba(174,195,176,.18);
      margin: .9rem 0;
    }
    .profile-stats {
      display: flex;
      justify-content: center;
      gap: 1.4rem;
      margin-bottom: 1rem;
      position: relative;
    }
    .profile-stat-val {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      color: var(--c2);
    }
    .profile-stat-lbl {
      font-size: .68rem;
      color: var(--c10);
      letter-spacing: .03em;
      text-transform: uppercase;
    }
    .btn-profile {
      border: 1.5px solid rgba(174,195,176,.30);
      background: rgba(207,225,185,.08);
      color: var(--c3);
      border-radius: 10px;
      font-size: .82rem;
      padding: .4rem 1rem;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      transition: all .2s;
      position: relative;
    }
    .btn-profile:hover {
      background: rgba(207,225,185,.18);
      border-color: rgba(207,225,185,.50);
      color: var(--c1);
    }

    /* ── Badges ── */
    .badge-cat {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      color: var(--accent);
      font-size: .70rem;
      padding: .25em .65em;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .badge-total {
      background: var(--bg-input);
      color: var(--text-muted);
      font-size: .73rem;
      border-radius: 20px;
      padding: .2em .65em;
      font-weight: 500;
    }

    /* ── Challenge Cards ── */
    .challenge-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      height: 100%;
      transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s, border-color .2s;
      overflow: hidden;
    }
    .challenge-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 40px rgba(15,42,29,.12);
      border-color: var(--border-med);
    }

    .challenge-cover {
      height: 88px;
      position: relative;
      overflow: hidden;
    }
    /* Each card gets a unique gradient via nth-child */
    .challenge-card:nth-child(1) .challenge-cover { background: linear-gradient(135deg, #c8dba8 0%, #aec3b0 100%); }
    .challenge-card:nth-child(2) .challenge-cover { background: linear-gradient(135deg, #b6c99b 0%, #88976c 100%); }
    .challenge-card:nth-child(3) .challenge-cover { background: linear-gradient(135deg, #d4e8be 0%, #98a77c 100%); }
    .challenge-card:nth-child(4) .challenge-cover { background: linear-gradient(135deg, #cfe1b9 0%, #728156 100%); }
    .challenge-card:nth-child(5) .challenge-cover { background: linear-gradient(135deg, #e3eed4 0%, #aec3b0 100%); }
    .challenge-card:nth-child(6) .challenge-cover { background: linear-gradient(135deg, #98a77c 0%, #375534 100%); }

    .challenge-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg, transparent, transparent 10px,
        rgba(255,255,255,.06) 10px, rgba(255,255,255,.06) 11px
      );
    }
    .challenge-cover .cover-icon {
      position: absolute;
      bottom: 10px;
      right: 14px;
      font-size: 1.8rem;
      opacity: .30;
      color: var(--c7);
    }

    /* ── Section title ── */
    .section-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      color: var(--text-dark);
    }

    /* ── Btn Voir ── */
    .btn-voir {
      border: 1.5px solid var(--border-med);
      background: transparent;
      color: var(--text-muted);
      border-radius: 10px;
      font-size: .79rem;
      padding: .3rem .8rem;
      font-family: 'DM Sans', sans-serif;
      transition: all .2s;
    }
    .btn-voir:hover {
      background: var(--c7);
      border-color: var(--c7);
      color: var(--c2);
      transform: scale(1.05);
    }

    /* ── Empty state ── */
    .empty-state {
      background: var(--bg-input);
      border: 1.5px dashed var(--border-med);
      border-radius: 16px;
      color: var(--text-muted);
    }

    /* ── Header badge ── */
    .hub-badge {
      background: var(--c7);
      color: var(--c3);
      font-size: .72rem;
      border-radius: 20px;
      padding: .22em .8em;
      font-weight: 600;
      letter-spacing: .04em;
    }

    /* ── Kbd ── */
    kbd {
      background: var(--bg-input);
      border: 1px solid var(--border-med);
      color: var(--text-muted);
      border-radius: 6px;
      font-size: .78em;
      padding: .1em .45em;
    }

    /* ── Misc ── */
    .muted { color: var(--text-muted); }
    a, button { outline: none; }
    hr.divider { border-color: var(--border-soft); opacity: 1; }

    /* ── Anim entrée ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .box, .profile-card {
      animation: fadeUp .4s ease both;
    }
    .challenge-card { animation: fadeUp .35s ease both; }
  </style>
</head>

<body>
  <div class="container py-4">

    <!-- ════════════════ Header ════════════════ -->
    <div class="box p-3 mb-3">
      <div class="d-flex flex-column flex-lg-row gap-2 align-items-lg-center justify-content-between">

        <div class="d-flex align-items-center gap-2 flex-shrink-0">
          <h5 class="m-0 serif fw-normal" style="color: var(--c7); font-size:1.25rem;">
            <i class="bi bi-compass me-1" style="color: var(--accent);"></i>Découvrir
          </h5>
          <span class="hub-badge">ChallengeHub</span>
        </div>

        <div class="d-flex flex-column flex-md-row gap-2 w-100 w-lg-auto align-items-md-center">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input id="searchInput" type="text" class="form-control" placeholder="Rechercher un défi…" />
          </div>

          <select id="sortSelect" class="form-select" style="min-width:195px;">
            <option value="popular">Trier : Popularité</option>
            <option value="newest">Trier : Plus récents</option>
            <option value="deadline">Trier : Date limite</option>
          </select>

          <button id="resetBtn" class="btn btn-reset">
            <i class="bi bi-arrow-counterclockwise me-1"></i>Réinitialiser
          </button>

          <button class="btn btn-create" onclick="alert('Page créer un défi (bientôt !)')">
            <i class="bi bi-plus-circle me-1"></i>Créer un défi
          </button>
        </div>
      </div>

      <div class="mt-2 small muted" style="font-size:.78rem;">
        Astuce : touche <kbd>/</kbd> pour aller directement sur la recherche.
      </div>
    </div>

    <!-- ════════════════ Contenu principal ════════════════ -->
    <div class="row g-3">

      <!-- ── Colonne gauche ── -->
      <div class="col-12 col-lg-3">

        <!-- Profil -->
        <div class="profile-card mb-3">
          <div class="profile-avatar-wrap">
            <img
              class="profile-avatar"
              src="https://img.freepik.com/premium-vector/user-icon-icon_1076610-59410.jpg"
              alt="Avatar Abdou"
            />
            <span class="profile-online" title="En ligne"></span>
          </div>
          <div class="profile-name">Abdou</div>
          <div class="profile-role">Créateur · Niveau 3 🌿</div>
          <hr class="profile-divider" />
          <div class="profile-stats">
            <div>
              <div class="profile-stat-val">12</div>
              <div class="profile-stat-lbl">Défis</div>
            </div>
            <div>
              <div class="profile-stat-val">84</div>
              <div class="profile-stat-lbl">Points</div>
            </div>
            <div>
              <div class="profile-stat-val">5</div>
              <div class="profile-stat-lbl">Victoires</div>
            </div>
          </div>
          <button class="btn btn-profile" onclick="alert('Page profil (bientôt !)')">
            <i class="bi bi-person-circle me-1"></i>Voir mon profil
          </button>
        </div>

        <!-- Catégories -->
        <div class="box p-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="section-title" style="font-size:.9rem;">
              <i class="bi bi-grid me-1" style="color:var(--accent);"></i>Catégories
            </div>
            <span class="badge-total" id="totalCount">0</span>
          </div>

          <div id="categoriesList" class="d-grid gap-2"></div>

          <hr class="divider mt-3" />

          <div class="muted" style="font-size:.73rem; line-height:1.5;">
            <i class="bi bi-info-circle me-1"></i>
            Filtrage JS (mock). Connecte PHP/MySQL pour les données réelles.
          </div>
        </div>
      </div>

      <!-- ── Colonne droite ── -->
      <div class="col-12 col-lg-9">
        <div class="box p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="section-title">
              <i class="bi bi-trophy me-1" style="color:var(--accent);"></i>Défis
            </div>
            <div class="muted small">
              <i class="bi bi-funnel me-1"></i>Résultats : <strong id="resultsCount" style="color:var(--accent);">0</strong>
            </div>
          </div>

          <div id="grid" class="row g-3"></div>

          <div id="emptyState" class="empty-state p-4 text-center mt-3 d-none">
            <i class="bi bi-search mb-2 d-block" style="font-size:2rem; color:var(--c4);"></i>
            <div class="fw-bold" style="color:var(--text-dark);">Aucun résultat trouvé</div>
            <div class="small mt-1 muted">Change le mot-clé ou la catégorie.</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const challenges = [
      { id: 1, title: "Logo minimaliste éco",    description: "Un logo simple + premium. PNG + SVG.",               category: "Design",      createdAt: "2026-02-10", deadline: "2026-03-05", popularity: 128, author: "Meriem",  icon: "bi-palette" },
      { id: 2, title: "Affiche cyberpunk",        description: "Affiche néon A3 avec un slogan percutant.",          category: "Illustration",createdAt: "2026-02-20", deadline: "2026-03-12", popularity: 210, author: "Yassine", icon: "bi-pen" },
      { id: 3, title: "Mini clip promo 10s",      description: "Vidéo verticale 9:16 pour un événement.",           category: "Vidéo",       createdAt: "2026-01-30", deadline: "2026-03-02", popularity: 95,  author: "Sara",    icon: "bi-camera-video" },
      { id: 4, title: "Landing page (1 écran)",   description: "Maquette hero + CTA pour une app mobile.",          category: "UI/UX",       createdAt: "2026-02-25", deadline: "2026-03-20", popularity: 156, author: "Omar",    icon: "bi-phone" },
      { id: 5, title: "Stories Instagram (x3)",   description: "3 slides cohérentes pour un lancement produit.",    category: "Social",      createdAt: "2026-02-18", deadline: "2026-03-08", popularity: 173, author: "Inès",    icon: "bi-instagram" },
      { id: 6, title: "Icônes (set de 12)",       description: "Icônes ligne pour un dashboard e-commerce.",        category: "Design",      createdAt: "2026-02-03", deadline: "2026-03-18", popularity: 82,  author: "Hamza",   icon: "bi-grid-1x2" }
    ];

    const state = { category: "Toutes", query: "", sort: "popular" };

    const grid           = document.getElementById("grid");
    const categoriesList = document.getElementById("categoriesList");
    const searchInput    = document.getElementById("searchInput");
    const sortSelect     = document.getElementById("sortSelect");
    const resetBtn       = document.getElementById("resetBtn");
    const resultsCount   = document.getElementById("resultsCount");
    const totalCount     = document.getElementById("totalCount");
    const emptyState     = document.getElementById("emptyState");

    const parseDate = s => new Date(s + "T00:00:00");

    const getCategories = () => ["Toutes", ...new Set(challenges.map(c => c.category))].sort((a, b) => a === "Toutes" ? -1 : b === "Toutes" ? 1 : a.localeCompare(b));
    const countByCategory = cat => cat === "Toutes" ? challenges.length : challenges.filter(c => c.category === cat).length;

    const iconMap = {
      "Toutes": "bi-grid", "Design": "bi-palette", "Illustration": "bi-pen",
      "Vidéo": "bi-camera-video", "UI/UX": "bi-phone", "Social": "bi-instagram"
    };

    function renderCategories() {
      categoriesList.innerHTML = "";
      totalCount.textContent = challenges.length;
      getCategories().forEach(cat => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn cat-btn" + (state.category === cat ? " active-cat" : "");
        btn.innerHTML = `
          <div class="d-flex justify-content-between align-items-center">
            <span><i class="bi ${iconMap[cat] || 'bi-tag'} me-2"></i>${cat}</span>
            <span class="badge-total">${countByCategory(cat)}</span>
          </div>`;
        btn.addEventListener("click", () => { state.category = cat; renderAll(); });
        categoriesList.appendChild(btn);
      });
    }

    function applyFilters() {
      let items = [...challenges];
      if (state.category !== "Toutes") items = items.filter(c => c.category === state.category);
      const q = state.query.trim().toLowerCase();
      if (q) items = items.filter(c => (c.title + " " + c.description + " " + c.author).toLowerCase().includes(q));
      if (state.sort === "popular")  items.sort((a, b) => b.popularity - a.popularity);
      if (state.sort === "newest")   items.sort((a, b) => parseDate(b.createdAt) - parseDate(a.createdAt));
      if (state.sort === "deadline") items.sort((a, b) => parseDate(a.deadline) - parseDate(b.deadline));
      return items;
    }

    function daysLeft(deadline) {
      const diff = Math.ceil((parseDate(deadline) - new Date()) / 86400000);
      if (diff < 0)   return `<span style="color:#c0392b;">Expiré</span>`;
      if (diff === 0) return `<span style="color:#e67e22;">Aujourd'hui</span>`;
      if (diff <= 3)  return `<span style="color:#e67e22;">${diff}j restants</span>`;
      return `<span style="color:var(--text-muted);">${diff}j restants</span>`;
    }

    function renderGrid(items) {
      grid.innerHTML = "";
      items.forEach((item, i) => {
        const col = document.createElement("div");
        col.className = "col-12 col-md-6 col-xl-4";
        col.style.animationDelay = (i * 0.05) + 's';
        col.innerHTML = `
          <div class="challenge-card">
            <div class="challenge-cover">
              <i class="bi ${item.icon || 'bi-star'} cover-icon"></i>
            </div>
            <div class="p-3">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge-cat">${item.category}</span>
                <span class="muted small" style="font-size:.78rem;">
                  <i class="bi bi-star-fill me-1" style="color:var(--c5);"></i>${item.popularity}
                </span>
              </div>
              <div class="fw-bold mb-1" style="color:var(--c7); font-size:.94rem; font-family:'DM Sans',sans-serif;">${item.title}</div>
              <div class="muted small mb-3" style="font-size:.81rem; line-height:1.5;">${item.description}</div>
              <hr style="border-color:var(--border-soft); opacity:1; margin:.5rem 0;">
              <div class="d-flex justify-content-between align-items-center mt-2">
                <div class="small" style="line-height:1.7;">
                  <div class="muted"><i class="bi bi-person me-1" style="color:var(--c9);"></i>${item.author}</div>
                  <div><i class="bi bi-clock me-1" style="color:var(--c9);"></i>${daysLeft(item.deadline)}</div>
                </div>
                <button class="btn btn-voir" data-id="${item.id}">
                  <i class="bi bi-eye me-1"></i>Voir
                </button>
              </div>
            </div>
          </div>`;
        col.querySelector("button").addEventListener("click", e => {
          alert("Ouvrir le défi ID: " + e.currentTarget.getAttribute("data-id") + " (bientôt : page PHP 🌿)");
        });
        grid.appendChild(col);
      });
    }

    function renderAll() {
      searchInput.value = state.query;
      sortSelect.value  = state.sort;
      renderCategories();
      const items = applyFilters();
      resultsCount.textContent = items.length;
      renderGrid(items);
      emptyState.classList.toggle("d-none", items.length !== 0);
    }

    searchInput.addEventListener("input",  e => { state.query = e.target.value; renderAll(); });
    sortSelect.addEventListener("change",  e => { state.sort  = e.target.value; renderAll(); });
    resetBtn.addEventListener("click", () => {
      state.category = "Toutes"; state.query = ""; state.sort = "popular";
      renderAll(); searchInput.focus();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "/" && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); }
    });

    renderAll();
  </script>
</body>
</html>
